<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160f2d">
  <title>Hi, Tabbu ✨</title>
  <style>
    :root { color-scheme: dark; --ink:#fff8f2; --muted:#d6c9e8; --pink:#ff8dc7; --peach:#ffbd91; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; background:radial-gradient(ellipse at 18% 18%, #553675 0, transparent 36%),radial-gradient(ellipse at 83% 78%, #743750 0, transparent 34%),linear-gradient(135deg,#100d24,#211336 52%,#180f2c); }
    body::before, body::after { content:""; position:fixed; width:38vmax; aspect-ratio:1; border-radius:50%; filter:blur(90px); opacity:.25; pointer-events:none; animation:drift 13s ease-in-out infinite alternate; background:#e969b6; top:-22vmax; left:-12vmax; }
    body::after { background:#846eff; top:auto; left:auto; bottom:-25vmax; right:-12vmax; animation-delay:-6s; }
    .stars { position:fixed; inset:0; pointer-events:none; background-image:radial-gradient(1px 1px at 8% 23%,#fff 60%,transparent),radial-gradient(1px 1px at 77% 18%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 89% 61%,#fff 60%,transparent),radial-gradient(1px 1px at 21% 82%,#fff 60%,transparent),radial-gradient(1px 1px at 63% 91%,#fff 60%,transparent),radial-gradient(1px 1px at 44% 10%,#fff 60%,transparent); opacity:.6; }
    .site-nav { position:fixed; z-index:2; top:1.4rem; left:50%; transform:translateX(-50%); display:flex; gap:.35rem; padding:.4rem; border:1px solid rgba(255,255,255,.17); border-radius:99px; background:rgba(24,15,42,.48); backdrop-filter:blur(14px); }
    .site-nav a { padding:.65rem 1rem; border-radius:99px; color:#e8dcef; text-decoration:none; font-size:.88rem; transition:background .2s,color .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.15); }
    .card { position:relative; width:min(90vw,680px); padding:clamp(2.5rem,8vw,5.5rem) clamp(1.6rem,7vw,4.5rem); text-align:center; border:1px solid rgba(255,255,255,.2); border-radius:32px; background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045)); box-shadow:0 32px 100px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.22); backdrop-filter:blur(18px); animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display:inline-flex; align-items:center; gap:.55rem; margin:0 0 1.4rem; padding:.55rem .95rem; border:1px solid rgba(255,255,255,.2); border-radius:99px; color:#ffe0ef; background:rgba(255,255,255,.08); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
    .sparkle { color:#ffd394; animation:twinkle 2s ease-in-out infinite; }
    h1 { margin:0; font-size:clamp(4rem,13vw,7.5rem); line-height:.98; letter-spacing:-.075em; font-weight:750; background:linear-gradient(110deg,#fff8f2 10%,#ffd5e9 48%,#ffc59c 90%); color:transparent; background-clip:text; -webkit-background-clip:text; text-shadow:0 12px 55px rgba(255,141,199,.14); }
    .subtitle { margin:1.5rem auto 0; max-width:30rem; color:var(--muted); font-size:clamp(1rem,2.5vw,1.2rem); line-height:1.8; }
    .rule { width:72px; height:2px; margin:2rem auto; border-radius:9px; background:linear-gradient(90deg,transparent,var(--pink),var(--peach),transparent); }
    .signoff { margin:0; color:#f7dfed; font-size:.95rem; letter-spacing:.05em; }
    .heart { display:inline-block; color:#ff91bd; animation:beat 1.4s ease-in-out infinite; }
    .orb { position:fixed; font-size:clamp(1.2rem,3vw,2rem); opacity:.7; animation:float 6s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(255,200,220,.65)); pointer-events:none; }
    .o1 { left:12%; top:24%; animation-delay:-1s; } .o2 { right:13%; top:30%; animation-delay:-3s; font-size:1.3rem; } .o3 { left:19%; bottom:19%; animation-delay:-4s; font-size:1.2rem; } .o4 { right:18%; bottom:17%; animation-delay:-2s; }
    @keyframes arrive { from { opacity:0; transform:translateY(28px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes drift { to { transform:translate(20vmax,16vmax) scale(1.2); } }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(-8deg); } 50% { transform:translateY(-16px) rotate(8deg); } }
    @keyframes twinkle { 50% { opacity:.45; transform:scale(.8) rotate(22deg); } }
    @keyframes beat { 50% { transform:scale(1.2); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <span class="orb o1" aria-hidden="true">✦</span><span class="orb o2" aria-hidden="true">✧</span>
  <span class="orb o3" aria-hidden="true">✦</span><span class="orb o4" aria-hidden="true">✧</span>
  <nav class="site-nav" aria-label="Main navigation"><a href="Hi Tabbu.html" aria-current="page">Home</a><a href="About.html">About</a><a href="Contact.html">Contact</a></nav>
  <main class="card">
    <p class="eyebrow"><span class="sparkle">✦</span> a little hello <span class="sparkle">✦</span></p>
    <h1>Hi, Tabbu!</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="subtitle">Just stopping by to make your day a little brighter. Keep being wonderfully you. ✨</p>
    <p class="signoff">Sending you a little joy <span class="heart">♥</span></p>
  </main>
</body>
</html>
